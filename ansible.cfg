[defaults]
roles_path = ./roles:./roles/legacy
interpreter_python = /usr/bin/python3
display_skipped_hosts = false
deprecation_warnings = false
inject_facts_as_vars = true
# Decrypts *.sops.yaml vars files at load time (needs the sops binary and an
# age key via SOPS_AGE_KEY_FILE or SOPS_AGE_KEY)
vars_plugins_enabled = host_group_vars,community.sops.sops

[ssh_connection]
pipelining = True
