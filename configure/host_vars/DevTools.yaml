---

hostname: devtools
tailscale_ip: 100.89.46.10
mount_nas: false

#######################
# Docker
#######################

docker:
  docker_dir: "/docker"
  domain: dev.autostack.ovh
  subdomain: "devtools"
  cert_resolver: "ovh"
  puid: 1000
  pgid: 1000
  docker_networks:
    - proxy_network
  composes:
    - name: traefik
      compose: network.yaml
      volumes:
        - letsencrypt
      config:
        - file: traefik.yaml
          dst: letsencrypt/traefik.yaml
    - name: slaves
      compose: slave-containers.yaml
    - name: devtools
      volumes:
        - forgejo
        - forgejo-runner
        - path: renovate   # Renovate image runs as uid 12021
          uid: 12021
          gid: 12021
        - redis_data
        - pg_data
      config:
        - file: forgejo-runner.yaml.j2
          dst: forgejo-runner/config.yml

#######################
# Backup (UrBackup)
#######################

urbackup:
  # Master is not in inventory-dev, so hostvars can't resolve it here: use its
  # Tailscale IP directly (keep in sync with tailscale_ip in Master.yaml)
  server_host: 100.108.226.73
  backup_dirs: # Directories backed up by the client on each node
    - "{{ docker.docker_dir }}/volumes"
  authkey: "{{ urbackup_authkeys.tools }}" 
