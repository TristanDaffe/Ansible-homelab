---

hostname: warehouse
tailscale_ip:
mount_nas: false

#######################
# Docker
#######################

docker:
  docker_dir: "/docker"
  domain: "{{ devtools_domain }}"
  subdomain: "warehouse"
  cert_resolver: "ovh"
  puid: 1000
  pgid: 1000
  docker_networks:
    - proxy_network
  composes:
    - name: traefik
      compose: network.yaml
      volumes:
        - letsencrypt
      config:
        - file: traefik.yaml
          dst: letsencrypt/traefik.yaml
    # No `slaves` stack while this is a test VM: slave-containers.yaml needs the
    # urbackup block below, which can't resolve MonitoringMaster in inventory-dev

# #######################
# # Backup (UrBackup)
# #######################
#
# urbackup:
#   # Master is not in inventory-dev, so hostvars can't resolve it here: use its
#   # Tailscale IP directly (keep in sync with tailscale_ip in Master.yaml)
#   server_host: 100.108.226.73
#   backup_dirs: # Directories backed up by the client on each node
#     - "{{ docker.docker_dir }}/volumes"
#   authkey: "{{ urbackup_authkeys.devtools }}"
