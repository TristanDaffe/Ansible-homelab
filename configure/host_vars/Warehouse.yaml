---

hostname: warehouse
tailscale_ip:
mount_nas: false

#######################
# Docker
#######################

docker:
  docker_dir: "/docker"
  domain: storage.autostack.ovh
  subdomain: "warehouse"
  cert_resolver: "ovh"
  puid: 1000
  pgid: 1000
  docker_networks:
    - proxy_network
  composes:
    - name: traefik
      compose: network.yaml
      volumes:
        - letsencrypt
      config:
        - file: traefik.yaml
          dst: letsencrypt/traefik.yaml
    - name: data-manager
      compose: data-manager.yaml
      volumes:
        - path: rustfs
          uid: 10001
          gid: 10001
        - postgres 

