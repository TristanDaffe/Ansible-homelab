############
# Shared defaults for ALL Proxmox nodes
############
# Per-node connection info, storage, VMs and LXC containers live in
# host_vars/<node>.yml (one file per node). This file holds only what is
# common to every node, plus the documented per-node schema at the bottom.

# --- Proxmox API ---------------------------------------------------------
# Token id/secret are secrets → group_vars/all/secret.all.yml (git-ignored):
#   proxmox_api_token_id:     "root@pam!ansible"
#   proxmox_api_token_secret: "xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"
# api_host defaults to the node being provisioned (each node talks to its own
# API). Override in host_vars if the API lives elsewhere, or add per-node
# proxmox_api_token_* in host_vars if a node belongs to a different cluster.
proxmox_api_user: root@pam
proxmox_api_host: "{{ ansible_host }}"
proxmox_validate_certs: false

# --- Networking / storage defaults ---------------------------------------
proxmox_bridge: vmbr0
proxmox_snippets_storage: local          # snippets + cloudinit; usually 'local'

# --- Console / OS locale -------------------------------------------------
keyboard_layout: fr-be                    # Proxmox VNC code
cloud_init_keyboard_layout: be            # cloud-init XKB code (Belgian AZERTY)

# --- Images / templates --------------------------------------------------
ubuntu_lts_image_url: "https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img"
ubuntu_lxc_template: "ubuntu-24.04-standard_24.04-2_amd64.tar.zst"

# --- LXC defaults --------------------------------------------------------
lxc_features:
  - keyctl=1
  - nesting=1

# =========================================================================
# PER-NODE FILE SCHEMA  →  host_vars/<node>.yml
# =========================================================================
# Every node listed in `inventory` gets a host_vars file. Placeholders:
#
#   ansible_host:     192.168.129.XXX   # node LAN IP (SSH + API target)
#   ansible_ssh_user: root
#   proxmox_node:     pve-XXX           # node NAME as shown in the Proxmox UI
#   proxmox_storage:  local-lvm         # disk storage that EXISTS on this node
#   cifs_mounts:      []                # optional NAS mounts on this node
#   vms:              [ ... ]           # VMs to create ON this node
#   lxc_containers:   [ ... ]           # LXC to create ON this node
#
# Provisioning is node-local (the cloud image is imported and `qm resize`
# runs on the node itself), so each node only provisions the vms/lxc in its
# OWN file. Running the whole playbook handles every node in one pass.
#
# vm entry fields:  name, vmid, cores, memory (MB), disk_gb, ciuser,
#                   autostart, ipconfig0 ("ip=<cidr>,gw=<gw>" or "ip=dhcp")
# lxc entry fields: hostname, ctid, cores, memory, rootfs_gb, ipconfig,
#                   privileged, autostart, features[], enable_tun,
#                   enable_igpu, nas_mounts[]
# =========================================================================
