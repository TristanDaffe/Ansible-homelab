---
# ============================================================================
# Kubernetes test cluster — VM provisioning inventory (TEMPLATE)
# ============================================================================
#
# Self-contained: every provisioning var lives here as a HOST var. Host vars
# outrank the prod defaults in nodesetup/group_vars/all/all.yml, so this file
# cleanly overrides `vms`, `proxmox_node`, etc. without touching prod. Your
# Proxmox API credentials are still read from the prod secret file
# (group_vars/all/secret.all.yml) — no need to duplicate secrets.
#
# WHY ONE NODE PER RUN:
#   Provisioning is node-local. The Ubuntu cloud image is downloaded onto, and
#   imported from, the SAME host Ansible connects to, and `qm resize` runs there
#   too. So `ansible_host` below MUST be the node you want these VMs on.
#   To put VMs on the OTHER cluster node, copy this file (e.g.
#   kubernetes-inventory-prod.yml), change ansible_host + proxmox_node + the vms
#   list, and run again.
#
# RUN (first time, per node — includes host prep + image download):
#   ansible-playbook -i nodesetup/kubernetes-inventory.yml nodesetup/nodesetup.yaml
#
# RUN (later, once the image already exists on the node — VMs only):
#   ansible-playbook -i nodesetup/kubernetes-inventory.yml nodesetup/nodesetup.yaml --tags proxmox-vm
# ============================================================================

proxmox:
  hosts:
    # ---- The cluster node these VMs run on ---------------------------------
    pve-k8s:                                # inventory alias (any label)
      ansible_host: 192.168.129.XXX         # <-- LAN IP of THIS Proxmox node
      ansible_ssh_user: root

      # ---- Proxmox placement ----------------------------------------------
      proxmox_node: pve-XXX                 # <-- node NAME as shown in the UI
      proxmox_storage: local-lvm            # <-- disk storage that exists ON this node
      proxmox_bridge: vmbr0
      proxmox_snippets_storage: local

      # ---- Keep the prod side untouched for this run ----------------------
      cifs_mounts: []                       # no NAS mounts on the k8s node
      lxc_containers: []                    # this run creates VMs only, no LXC

      # ---- Kubernetes VMs (Ubuntu 24.04 cloud image) ----------------------
      # cloud-init injects your ~/.ssh/id_rsa.pub automatically (see the
      # nodesetup pre_task). VMIDs are cluster-wide unique — keep them clear
      # of prod (prod uses 125 / 223 / 224).
      vms:
        - name: k8s-cp-1                    # control-plane node
          vmid: 130
          cores: 2
          memory: 4096                      # MB — 4 GB is comfortable for a test CP
          disk_gb: 40
          ciuser: susu
          autostart: true
          ipconfig0: "ip=192.168.129.130/23,gw=192.168.128.1"

        - name: k8s-worker-1
          vmid: 131
          cores: 2
          memory: 4096
          disk_gb: 40
          ciuser: susu
          autostart: true
          ipconfig0: "ip=192.168.129.131/23,gw=192.168.128.1"

        # Put additional workers HERE if they should live on THIS node.
        # Workers for the OTHER cluster node go in a second copy of this file
        # (see the header). Example for that second file:
        #
        #   - name: k8s-worker-2
        #     vmid: 132
        #     cores: 2
        #     memory: 4096
        #     disk_gb: 40
        #     ciuser: susu
        #     autostart: true
        #     ipconfig0: "ip=192.168.129.132/23,gw=192.168.128.1"
