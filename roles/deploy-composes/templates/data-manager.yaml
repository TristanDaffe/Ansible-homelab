services:
  rustfs:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      - RUSTFS_VOLUMES=/data/rustfs0
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
      - RUSTFS_ACCESS_KEY={{ rustfs.access_key }}
      - RUSTFS_SECRET_KEY={{ rustfs.secret_key }}
      - RUSTFS_REGION=auto
      - RUSTFS_OBS_LOGGER_LEVEL=info
      - RUSTFS_OBS_LOG_DIRECTORY=/logs
      - RUSTFS_IDENTITY_OPENID_ENABLE=on
      - RUSTFS_IDENTITY_OPENID_CONFIG_URL=https://pocket-id.{{ docker.domain }}/.well-known/openid-configuration
      - RUSTFS_IDENTITY_OPENID_CLIENT_ID={{ rustfs.client_id }}
      - RUSTFS_IDENTITY_OPENID_CLIENT_SECRET={{ rustfs.client_secret }}
      - RUSTFS_IDENTITY_OPENID_SCOPES=openid,profile,email
      - RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM=groups
      - RUSTFS_IDENTITY_OPENID_ROLES_CLAIM=roles
    volumes:
      - "{{ docker.docker_dir }}/volumes/rustfs/data:/data"
      - "{{ docker.docker_dir }}/volumes/rustfs/logs:/logs"
    networks:
      - proxy_network
    labels:
      - "traefik.enable=true"
      # RustFS UI
      - "traefik.http.services.rustfs-ui.loadbalancer.server.port=9001"
      - "traefik.http.routers.rustfs-ui.rule=Host(`bucket.{{ docker.domain }}`)"
      - "traefik.http.routers.rustfs-ui.entrypoints=websecure"
      - "traefik.http.routers.rustfs-ui.service=rustfs-ui"

      - "traefik.http.services.rustfs-bucket.loadbalancer.server.port=9000"
      - "traefik.http.routers.rustfs-bucket.rule=Host(`s3.{{ docker.domain }}`)"
      - "traefik.http.routers.rustfs-bucket.entrypoints=websecure"
      - "traefik.http.routers.rustfs-bucket.service=rustfs-bucket"

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "{{ db.pass }}"
      POSTGRES_USER: "{{ db.user }}"
    volumes:
      - "{{ docker.docker_dir }}/volumes/postgres:/var/lib/postgresql"
    shm_size: 128mb
    networks:
      - proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.tcp.routers.postgres.rule=HostSNI(`*`)"
      - "traefik.tcp.routers.postgres.entrypoints=postgres"
      - "traefik.tcp.routers.postgres.service=postgres"
      - "traefik.tcp.services.postgres.loadbalancer.server.port=5432"

networks:
  proxy_network:
    external: true

