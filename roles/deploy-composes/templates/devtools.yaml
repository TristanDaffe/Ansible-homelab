---
services:

  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    restart: always
    environment:
      - "USER_UID={{ docker.puid }}"
      - "USER_GID={{ docker.pgid }}"
      - "FORGEJO__server__ROOT_URL=https://git.{{ docker.domain }}/"
      - "FORGEJO__server__SSH_DOMAIN=git.{{ docker.domain }}"
      - "FORGEJO__server__SSH_PORT=222"
      - "ENABLE_OPENID_SIGNIN=false"
    networks:
      - dev
      - proxy_network
    volumes:
      - "{{ docker.docker_dir }}/volumes/forgejo:/data"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - '222:22'
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.forgejo.loadbalancer.server.port=3000"
      - "traefik.http.routers.forgejo.rule=Host(`git.{{ docker.domain }}`)"
      - "traefik.http.routers.forgejo.entrypoints=websecure"

  forgejo-runner:
    image: data.forgejo.org/forgejo/runner:13.2.0
    restart: unless-stopped
    depends_on:
      - forgejo
    # root to use the host Docker socket (socket access is root-equivalent anyway)
    user: "0:0"
    working_dir: /data
    command: forgejo-runner --config config.yml daemon
    networks:
      - dev
    volumes:
      - "{{ docker.docker_dir }}/volumes/forgejo-runner:/data"
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - wud.watch=false

  # Renovate is a one-shot CLI: rerun it on a fixed interval. It opens image
  # update PRs on this repo; repo-side behaviour lives in renovate.json.
  renovate:
    image: ghcr.io/renovatebot/renovate:44.184.1
    restart: unless-stopped
    depends_on:
      - forgejo
    command: ["bash", "-c", "while true; do renovate; sleep {{ renovate.interval | default(21600) }}; done"]
    environment:
      - RENOVATE_PLATFORM=forgejo
      # Internal URL on the `dev` network, for the API and (gitUrl=endpoint) for cloning
      - RENOVATE_ENDPOINT=http://forgejo:3000/api/v1
      - RENOVATE_GIT_URL=endpoint
      - "RENOVATE_TOKEN={{ renovate.token | mandatory('renovate.token missing from secret.all.sops.yaml') }}"
      - RENOVATE_REPOSITORIES=Susu/Ansible-homelab
      - "RENOVATE_GIT_AUTHOR=Renovate Bot <renovate@{{ docker.domain }}>"
      - RENOVATE_BASE_DIR=/tmp/renovate
      - LOG_LEVEL=info
{% if renovate.github_com_token is defined %}
      # Read-only GitHub token: release notes in PRs + avoids GitHub API rate limits
      - "GITHUB_COM_TOKEN={{ renovate.github_com_token }}"
{% endif %}
    networks:
      - dev
    volumes:
      - "{{ docker.docker_dir }}/volumes/renovate:/tmp/renovate"
    labels:
      - wud.watch=false

  infisical-backend:
    image: infisical/infisical:v0.167.3
    restart: unless-stopped
    pull_policy: always
    depends_on:
      infisical-db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - NODE_ENV=production
      - ENCRYPTION_KEY={{ infisical['encryption-key'] }}
      - AUTH_SECRET={{ infisical['auth-secret'] }}
      - DB_CONNECTION_URI=postgres://{{ infisical['db-user'] }}:{{ infisical['db-pass'] }}@infisical-db:5432/{{ infisical['db-name'] }}
      - REDIS_URL=redis://redis:6379
      - SITE_URL=https://pass.{{ docker.domain }}
    networks:
      - infisical
      - proxy_network
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.infisical.loadbalancer.server.port=8080"
      - "traefik.http.routers.infisical.rule=Host(`pass.{{ docker.domain }}`)"
      - "traefik.http.routers.infisical.entrypoints=websecure"

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - infisical
    volumes:
      - "{{ docker.docker_dir }}/volumes/redis_data:/data"
    labels:
      - wud.watch=false

  infisical-db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER={{ infisical['db-user'] }}
      - POSTGRES_PASSWORD={{ infisical['db-pass'] }}
      - POSTGRES_DB={{ infisical['db-name'] }}
    volumes:
      - "{{ docker.docker_dir }}/volumes/pg_data:/var/lib/postgresql/data"
    networks:
      - infisical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username={{ infisical['db-user'] }} --dbname={{ infisical['db-name'] }}"]
      interval: 5s
      timeout: 10s
      retries: 10
    labels:
      - wud.watch=false

networks:
  proxy_network:
    external: true
  dev:
  infisical:
