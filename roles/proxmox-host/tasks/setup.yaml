---
- name: Install powertop
  ansible.builtin.package:
    name: powertop
    state: present

# Re-applies kernel/device power tunables on every run (not read-only),
# so report it honestly as a change.
- name: Autotune powertop
  ansible.builtin.command: powertop --auto-tune
  changed_when: true

- name: Ensure ISO template directory exists
  ansible.builtin.file:
    path: /var/lib/vz/template/iso
    state: directory
    mode: '0755'

- name: Ensure cloud-init snippets directory exists
  ansible.builtin.file:
    path: /var/lib/vz/snippets
    state: directory
    mode: '0755'

- name: Deploy cloud-init user-data snippet
  ansible.builtin.template:
    src: user-data.yaml.j2
    dest: /var/lib/vz/snippets/user-data.yaml
    mode: '0644'

- name: Ensure LXC template cache directory exists
  ansible.builtin.file:
    path: /var/lib/vz/template/cache
    state: directory
    mode: '0755'

# Idempotent via creates: — no stat pre-check needed. Each LXC may select its
# own template; existing containers continue using their current template.
- name: Download required LXC templates
  ansible.builtin.command: "pveam download local {{ item }}"
  args:
    creates: "/var/lib/vz/template/cache/{{ item }}"
  loop: >-
    {{
      ([ubuntu_lxc_template] +
       (lxc_containers | default([])
        | selectattr('template', 'defined')
        | map(attribute='template')
        | list))
      | unique
    }}
  loop_control:
    label: "{{ item }}"

# Idempotent via get_url's default force: false — skipped when dest exists.
- name: Download Ubuntu LTS cloud image
  ansible.builtin.get_url:
    url: "{{ ubuntu_lts_image_url }}"
    dest: "/var/lib/vz/template/iso/{{ ubuntu_cloudimg_filename }}"
    mode: '0644'
